<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibecheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6f4;--panel:#ffffff;--sunk:#eef1ee;--ink:#18201d;--muted:#5f6d68;--faint:#8a9792;--line:#e0e5e2;
  --accent:#1d6b58;--accent-soft:#e2efea;--warn:#95590a;--warn-soft:#fbf0dc;--bad:#a1352d;--bad-soft:#f8e4e1;
  --hit:#c99a00;--hit-soft:#ffe98a;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614;--panel:#171e1b;--sunk:#141a17;--ink:#e1e9e5;--muted:#96a6a0;--faint:#6c7b75;--line:#27302c;
  --accent:#6cc3aa;--accent-soft:#1b2d27;--warn:#eeb25a;--warn-soft:#30250f;--bad:#ee8a82;--bad-soft:#381c19;--hit:#ffd400;--hit-soft:#5a4a00;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:0 4px;border-radius:4px}

header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-family:var(--mono);font-weight:600;font-size:15px}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.counts{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.ok{background:var(--accent-soft);color:var(--accent)}
.playf{flex:1 1 360px;display:flex;gap:6px;min-width:0}
.playf input{flex:1;min-width:0;font:13px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.playf.bad input{border-color:var(--bad)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.live.err .dot{background:var(--bad)}
.errbox{max-width:1100px;margin:10px auto 0;padding:0 20px}
.errbox pre{margin:0;background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;font:12px var(--mono);white-space:pre-wrap}

.page{max-width:1100px;margin:0 auto;padding:18px 20px 60px;display:grid;gap:26px}
h2.group-h{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);margin:0 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2.group-h .why{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:13px}
.stack{display:grid;gap:8px}
.sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:6px}
.hint{color:var(--faint);font-size:13px;margin:0}
.sym{background:none;border:0;padding:0;cursor:pointer;font-family:var(--mono);font-size:13px;text-align:left;overflow-wrap:anywhere}
.sym:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sym.k-class{color:var(--accent);font-weight:600}
.chip{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:5px;background:var(--accent-soft);border:0;cursor:pointer}
.chip:hover{outline:1px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* the score card */
.scorecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 24px;align-items:center}
.overall{display:grid;justify-items:center;gap:2px;min-width:120px}
.overall b{font:600 56px/1 var(--mono);font-variant-numeric:tabular-nums}
.overall .of{font-size:12px;color:var(--faint)}
svg.hex{width:100%;max-width:340px;height:auto;display:block;justify-self:center}
svg.hex .grid{fill:none;stroke:var(--line)}
svg.hex .axis{stroke:var(--line)}
svg.hex .now{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:2;transition:d .6s}
svg.hex text{font:600 11px var(--sans);fill:var(--muted)}
svg.hex text.v{font:600 11px var(--mono);fill:var(--ink)}
.attrs{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 12px}
.attr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:8px}
.attr .l{font-weight:600}
.attr .n{font:600 14px var(--mono);font-variant-numeric:tabular-nums;justify-self:end}
.attr .d{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.bar5{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar5 i{display:block;height:100%;background:var(--accent);transition:width .6s}
@media (max-width:640px){.scorecard{grid-template-columns:1fr}}

/* findings */
.finding{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;padding:9px 12px;display:grid;gap:3px}
.finding .head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.finding .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
.finding .fix{color:var(--accent);font-size:13px}
.finding .fix::before{content:"Fix  ";font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.skipped{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.clean{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.clean b{display:block;font:600 22px var(--mono);color:var(--accent);margin-bottom:4px}

/* doors */
.door{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;cursor:pointer}
.door.over{border-left-color:var(--bad)}
.door:hover{border-color:var(--accent)}
.door .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.door .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
.door .open{margin-left:auto;font-size:12px;color:var(--accent)}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px}
.to{color:var(--faint)}
.more{font-size:12px;padding:6px 12px;border-radius:6px;background:none;border:1px dashed var(--line);cursor:pointer;color:var(--muted);justify-self:start}

/* the modal: the trace or the symbol on the left, the code on the right */
dialog.dia{width:100vw;height:100vh;max-width:100vw;max-height:100vh;margin:0;padding:0;border:0;border-radius:0;background:var(--panel);color:var(--ink)}
dialog.dia::backdrop{background:rgba(10,16,14,.45)}
.dia-in{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.dia-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dia-title{font-family:var(--mono);font-weight:600;margin-right:auto;overflow-wrap:anywhere}
.sbtn{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.sbtn:hover{border-color:var(--accent)}
.sbtn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dia-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:0;overflow:hidden}
.canvas{overflow:auto;background:var(--bg);min-height:0}
.dia-foot{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.codepane{border-left:1px solid var(--line);overflow:auto;background:var(--panel);min-height:0}
.codepane .ch{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;font:12px var(--mono);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:1}
.codepane .ch b{color:var(--ink)}
.codepane .hint{padding:16px}
.code{margin:0;font:12.5px/1.55 var(--mono);padding:6px 0}
.code .ln{display:grid;grid-template-columns:52px minmax(0,1fr);transition:background .5s,box-shadow .5s}
.code .ln i{font-style:normal;color:var(--faint);text-align:right;padding-right:12px;user-select:none}
.code .ln .src{padding-right:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.code .ln.fn{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.code .ln.fn i{color:var(--accent)}
.code .ln.hit{background:var(--hit-soft);box-shadow:inset 4px 0 var(--hit)}
.code .ln.hit i{color:var(--hit);font-weight:600}
/* while the animation reads down to the block, the call it reaches is not lit yet */
.code.unlit .ln.hit{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.code.unlit .ln.hit i{color:var(--accent);font-weight:400}
.filebtn{margin-left:auto;font:12px var(--sans);padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer}
.filebtn:hover,.filebtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.tk-k{color:#7a3e9d}.tk-s{color:#1d6b58}.tk-c{color:var(--faint);font-style:italic}.tk-n{color:#95590a}.tk-d{color:#a1352d;font-weight:600}.tk-f{color:#1a4f8b;font-weight:600}
@media (prefers-color-scheme:dark){.tk-k{color:#c792ea}.tk-s{color:#8fd4b8}.tk-n{color:#eeb25a}.tk-d{color:#ee8a82}.tk-f{color:#82aaff}}
.trace{padding:18px 22px;display:grid;max-width:720px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;display:grid;gap:2px}
.step:hover{border-color:var(--accent)}
.step.sel{border-color:var(--accent);background:var(--accent-soft)}
.step .f{font:11px var(--mono);color:var(--faint)}
.step .n{font:500 13.5px var(--mono)}
.step .n .c{color:var(--accent);font-weight:600}
.step .d{color:var(--muted);font-size:12.5px}
.step .call{font:12px var(--mono);color:var(--warn)}
.step .flag{font:11px var(--mono);color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:0 6px;justify-self:start}
.step .also{font:11px var(--mono);color:var(--faint)}
.step.sink{border-style:dashed}
.step.seen{opacity:.7}
.step.onflow{border-left:3px solid var(--accent)}
.step.next{border-color:var(--hit);box-shadow:0 0 0 1px var(--hit)}
.branches{display:grid;gap:10px;margin-top:10px}
.branch{border-left:2px solid var(--line);padding-left:14px;margin-left:22px;display:grid}
.trace .down{padding-left:22px;color:var(--faint);font:13px var(--mono);height:20px;display:flex;align-items:center}
.about{padding:18px 22px;display:grid;gap:14px;max-width:720px}
.about .kind{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.about .sname{font-family:var(--mono);font-size:17px;font-weight:600;overflow-wrap:anywhere}
.about .sname .c{color:var(--accent)}
.about .sdoc{color:var(--muted)}
.about .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* stories: one issue told step by step, its tokens marked in the code */
.story{padding:18px 22px;display:grid;gap:12px;max-width:720px}
.story .issue{display:grid;gap:4px}
.story .issue .t{font:600 13px var(--mono);color:var(--bad)}
.story .issue .fix{color:var(--accent);font-size:13px}
.story .tokens{display:flex;gap:6px;flex-wrap:wrap}
.station{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;display:grid;gap:3px;cursor:pointer;transition:border-color .3s,background .3s,opacity .3s}
.station.done{opacity:.55}
.station.sel{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.station .f{font:11px var(--mono);color:var(--faint)}
.station .n{font:500 13.5px var(--mono)}
.station .cap{font-size:13px;color:var(--muted)}
.station.sel .cap{color:var(--ink)}
.station.last{border-style:dashed}
.story .down{padding-left:22px;color:var(--faint);font:13px var(--mono);height:16px;display:flex;align-items:center}
mark.mk{border-radius:3px;padding:0 2px;color:inherit;font-weight:600}
mark.m0{background:#ffd6d1;box-shadow:0 0 0 1px #e27c70}mark.m1{background:#d3e8ff;box-shadow:0 0 0 1px #6fa3d8}
mark.m2{background:#dcf2d6;box-shadow:0 0 0 1px #7cbf6c}mark.m3{background:#f3dcff;box-shadow:0 0 0 1px #b57fd6}
@media (prefers-color-scheme:dark){mark.m0{background:#5a2620}mark.m1{background:#1d3b5c}mark.m2{background:#24401e}mark.m3{background:#43285a}}
.code .ln.add{background:#e6f6e6}.code .ln.del{background:#fbe9e7}.code .ln.hunk{color:var(--faint);background:var(--sunk)}
@media (prefers-color-scheme:dark){.code .ln.add{background:#17301a}.code .ln.del{background:#3a1c19}}
.code .ln.add i::after{content:"+"}.code .ln.del i::after{content:"−"}
.station .commit{font:12px var(--mono);color:var(--accent)}
.code .ln.hit mark.mk{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--hit)}}
svg.tree{display:block;margin:20px}
svg.tree .box rect{fill:var(--panel);stroke:var(--line)}
svg.tree .box.root rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg.tree .box.more rect{stroke:var(--accent);stroke-dasharray:4 3}
svg.tree .box.flagged rect{stroke:var(--bad)}
svg.tree .box.seen{opacity:.6}
svg.tree .box{cursor:pointer}
svg.tree .box:hover rect{stroke:var(--accent)}
svg.tree .f{font:11px var(--mono);fill:var(--faint)}
svg.tree .n{font:500 13px var(--mono);fill:var(--ink)}
svg.tree .n .c{fill:var(--accent);font-weight:600}
svg.tree .cnt{font:600 11px var(--mono);fill:var(--accent)}
svg.tree .flg{font:600 11px var(--mono);fill:var(--bad)}
svg.tree .edge{fill:none;stroke:var(--faint);stroke-width:1.3}
svg.tree marker path{fill:var(--faint)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:8px}
.tab{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px}
.tab[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (max-width:900px){.dia-body{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.codepane{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="brand">vibecheck<small id="pkg"></small></span>
  <span class="counts" id="counts"></span>
  <form id="play-form" class="playf"><input id="play-q" type="search" placeholder="Play a flow: handle_request  or  handle_request > open_session > save" autocomplete="off"><button class="sbtn" type="submit">Play</button></form>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">connecting</span></span>
</div></header>
<div class="errbox" id="err" hidden><pre id="err-text"></pre></div>
<div class="page" id="main"></div>
<dialog class="dia" id="dia">
  <div class="dia-in">
    <div class="dia-head">
      <span class="dia-title" id="dia-title"></span>
      <div class="tabs" id="dia-tabs" hidden><button class="tab" data-view="about" aria-pressed="true">About</button><button class="tab" data-view="up" aria-pressed="false">Who uses it</button><button class="tab" data-view="down" aria-pressed="false">What it calls</button></div>
      <button class="sbtn" id="dia-all" hidden>Expand all</button>
      <button class="sbtn" id="dia-none" hidden>Collapse</button>
      <button class="sbtn" id="dia-play" aria-pressed="false" hidden title="Walk the trace: each file read down to its step, then on to the next">Animate</button>
      <select class="sbtn" id="dia-speed" hidden title="Animation speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option></select>
      <button class="sbtn" id="dia-close" autofocus>Close</button>
    </div>
    <div class="dia-body"><div class="canvas" id="dia-canvas"></div><div class="codepane" id="codepane"><p class="hint">Pick a step to read its code.</p></div></div>
    <div class="dia-foot" id="dia-foot"></div>
  </div>
</dialog>
<script>
let G = null, VERSION = -1, FIRST = true, CUE = null;
const state = {doors: 12};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const file = m => G.modules[m] ? G.modules[m].file : m.replace(/\./g, "/") + ".py";
const S = id => G.symbols[id];
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function nameParts(id){
  const [m, n] = id.split(":");
  if (n === undefined) return {file: file(m), cls: "", rest: "module"};
  const s = S(id); const parts = n.split(".");
  if (parts.length === 2) return {file: file(m), cls: parts[0], rest: "." + parts[1] + "()"};
  if (s && s.kind === "class") return {file: file(m), cls: n, rest: ""};
  return {file: file(m), cls: "", rest: n + (s && s.kind === "function" ? "()" : "")};
}
function symButton(id){
  const s = S(id); if (!s) return `<button class="sym" data-mod="${esc(id)}">${esc(file(id))}</button>`;
  const label = s.kind === "method" ? s.name.split(".").pop() + "()" : s.name + (s.kind === "function" ? "()" : "");
  return `<button class="sym k-${s.kind}" data-sym="${esc(id)}">${esc(label)}</button>`;
}

/* ── the score: a player card of six attributes ── */
function hexagon(attrs){
  const cx = 170, cy = 125, R = 88, n = attrs.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
  const poly = vals => vals.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(",")).join(" ");
  let g = "";
  for (const lvl of [25, 50, 75, 100]) g += `<polygon class="grid" points="${poly(attrs.map(() => lvl))}"/>`;
  attrs.forEach((a, i) => { const [x, y] = pt(i, 100); g += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; });
  g += `<polygon class="now" points="${poly(attrs.map(a => a.value))}"/>`;
  attrs.forEach((a, i) => { const [x, y] = pt(i, 122); const anchor = Math.abs(x - cx) < 8 ? "middle" : x > cx ? "start" : "end";
    g += `<text x="${x}" y="${y - 4}" text-anchor="${anchor}">${esc(a.label)}</text><text class="v" x="${x}" y="${y + 9}" text-anchor="${anchor}">${a.value}</text>`; });
  return `<svg class="hex" viewBox="0 0 340 250" role="img" aria-label="Score by attribute">${g}</svg>`;
}
function scoreCard(){
  const sc = G.score;
  const rows = sc.attributes.map(a => `<div class="attr"><span class="l">${esc(a.label)}</span><span class="n">${a.value}</span>
      <span class="bar5"><i style="width:${a.value}%"></i></span><span class="d">${esc(a.detail)}</span></div>`).join("");
  return `<div class="scorecard"><div class="overall"><b>${sc.overall}</b><span class="of">of 100</span></div>${hexagon(sc.attributes)}<div class="attrs">${rows}</div></div>`;
}

/* ── findings, grouped by check, each group with the check's note ── */
function findingHtml(f){
  // A module's finding names the file already; a symbol's names the symbol beside it.
  const route = STORIES[f.check] ? null : flowOf(f);
  const button = STORIES[f.check] ? `<button class="sbtn" data-story="${esc(f.id)}" title="Watch this issue happen in the code">watch</button>` : route ? `<button class="sbtn" data-play="${esc(route.join(">"))}" title="Animate the path this finding is about">play</button>` : "";

/* ── animate: the tree read as the code reads, each body down to a call, into it, and back for the next ── */

  const {f, tale, at} = STORY;
  const cards = tale.stations.map((st, i) => `${i ? `<div class="down">↓</div>` : ""}<div class="station ${i === at ? "sel" : i < at ? "done" : ""} ${st.last ? "last" : ""}" data-station="${i}">
      <span class="f">${st.diff ? `<span class="commit">${esc(st.name.file)}</span>` : `${esc(st.file)}:${st.focus[0] || st.from}`}</span>
      <span class="n">${st.name.cls ? `<b>${esc(st.name.cls)}</b>` : ""}${esc(st.name.rest)}</span>
      <span class="cap">${st.cap}</span></div>`).join("");
  document.getElementById("dia-canvas").innerHTML = `<div class="story"><div class="issue"><span class="t">${esc(G.checks[f.check].title)}</span><span>${md(f.message)}</span><span class="fix">Fix: ${md(f.fix)}</span></div>
    <div class="tokens">${tale.tokens.map((t, i) => `<mark class="mk m${i % 4}">${esc(t)}</mark>`).join("")}</div>${cards}</div>`;
  document.getElementById("dia-foot").textContent = `${tale.stations.length} stations. Watch plays them in order; click one to read it.`;

function openStory(id, autoplay){
  const f = G.findings.find(x => x.id === id); if (!f || !STORIES[f.check]) return;
  DIA.mode = "story"; STORY.f = f; STORY.tale = STORIES[f.check](f); STORY.at = 0; CODE.shown = null;
  document.getElementById("dia-title").textContent = `${G.checks[f.check].title} · ${f.file}:${f.line}`;

async function playStory(alive, wait, rate){
  const pane = document.getElementById("codepane"), pace = d => Math.min(2500, Math.max(600, Math.abs(d) * .8));
  for (let i = 0; i < STORY.tale.stations.length; i++){
    STORY.at = i; await drawStory(); if (!alive()) return;
    const start = pane.querySelector(".ln.start"), hit = pane.querySelector(".ln.hit");

function hideTree(){ document.getElementById("dia-tabs").hidden = document.getElementById("dia-all").hidden = document.getElementById("dia-none").hidden = true; }
function showView(){
  document.querySelectorAll("#dia-tabs .tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === DIA.view));
  const tree = DIA.view !== "about";
  document.getElementById("dia-all").hidden = document.getElementById("dia-none").hidden = !tree;
  if (!tree){ document.getElementById("dia-canvas").innerHTML = DIA.about; document.getElementById("dia-foot").textContent = "Click a name to move to it."; return; }
  drawDiagram();
}
const usersOf = id => S(id) ? [...new Set(S(id).usedBy)].filter(u => S(u)).sort() : [];
const calleesOf = id => S(id) ? [...S(id).calls].filter(c => S(c)).sort() : [];
const diaKids = id => DIA.view === "up" ? usersOf(id) : calleesOf(id);
function buildTree(id, path){
  const key = [...path, id].join(">"), seen = path.includes(id);
  const kids = seen ? [] : diaKids(id);
  const open = !seen && (!path.length || DIA.open.has(key));
  return {id, key, seen, count: kids.length, open, children: open ? kids.map(k => buildTree(k, [...path, id])) : []};
}
function drawDiagram(){
  const root = buildTree(DIA.symbol, []);
  const H = 46, GAP = 12, COLGAP = 84;
  const width = n => { const p = nameParts(n.id); return Math.ceil(Math.max(p.file.length * 6.7, (p.cls.length + p.rest.length) * 7.9) + 38); };
  const cols = [], all = [];
  (function walk(n, d){ n.depth = d; cols[d] = Math.max(cols[d] || 0, width(n)); n.children.forEach(c => walk(c, d + 1)); })(root, 0);
  let y = 0;
  (function place(n){ if (!n.children.length){ n.y = y; y += H + GAP; } else { n.children.forEach(place); n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2; } all.push(n); })(root);
  const X = []; let acc = 0; cols.forEach((w, d) => { X[d] = acc; acc += w + COLGAP; });
  const W = acc - COLGAP, Ht = Math.max(y - GAP, H);
  all.forEach(n => { n.w = cols[n.depth]; n.x = DIA.view === "up" ? W - X[n.depth] - cols[n.depth] : X[n.depth]; });
  let edges = "", boxes = "";
  for (const n of all){
    for (const c of n.children){
      const [a, b] = DIA.view === "up" ? [c, n] : [n, c];
      const x1 = a.x + a.w, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      edges += `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 3},${y2}" marker-end="url(#arrow)"/>`;
    }
    const p = nameParts(n.id), flagged = !n.seen && findingsAt(n.id).length;
    const cls = [!n.key.includes(">") ? "root" : n.seen ? "seen" : n.count && !n.open ? "more" : "", flagged ? "flagged" : ""].join(" ");
    const mark = n.seen ? "↺" : n.count && !n.open ? "+" + n.count : "";
    boxes += `<g class="box ${cls}" data-key="${esc(n.key)}" transform="translate(${n.x},${n.y})"><rect width="${n.w}" height="${H}" rx="7"/><text class="f" x="11" y="17">${esc(p.file)}</text><text class="n" x="11" y="35"><tspan class="c">${esc(p.cls)}</tspan>${esc(p.rest)}</text>${mark ? `<text class="cnt" x="${n.w - 9}" y="17" text-anchor="end">${mark}</text>` : ""}${flagged ? `<text class="flg" x="${n.w - 9}" y="37" text-anchor="end">⚑</text>` : ""}</g>`;
  }
  document.getElementById("dia-canvas").innerHTML = `<svg class="tree" width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Usage tree"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>${edges}${boxes}</svg>`;
  document.getElementById("dia-foot").textContent = (DIA.view === "up" ? "Arrows point from the one that uses to the one used. " : "Arrows point from the caller to the one called. ") + "A box with +N has N more to open: click it. ↺ is already on that path. ⚑ carries a finding.";
}
function expandAll(limit){
  const queue = [[DIA.symbol, []]]; let n = 0;
  while (queue.length && n < limit){ const [id, path] = queue.shift(); if (path.includes(id)) continue; if (path.length){ DIA.open.add([...path, id].join(">")); n++; } diaKids(id).forEach(k => queue.push([k, [...path, id]])); }
  drawDiagram();
}
function openDia(){ const d = document.getElementById("dia"); if (!d.open) d.showModal(); }
function setHash(){
  const d = document.getElementById("dia");
  const h = !d.open ? "" : DIA.mode === "story" ? "story=" + encodeURIComponent(STORY.f.id) : DIA.mode === "trace" && TRACE.flow ? "play=" + encodeURIComponent(TRACE.flow.join(">")) : DIA.mode === "trace" ? "trace=" + encodeURIComponent(TRACE.entry) : "sym=" + encodeURIComponent(DIA.symbol);
  history.replaceState(null, "", h ? "#" + h : location.pathname);
}
function fromHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("story")) openStory(h.get("story"), true);
  else if (h.get("play")) openFlow(h.get("play").split(">"), true);
  else if (h.get("trace")) openTrace(h.get("trace"));
  else if (h.get("sym")) openSymbol(h.get("sym"));
}

/* ── render and events ── */
function render(){
  if (!G) return;
  const y = window.scrollY;
  document.getElementById("main").innerHTML = scoreCard() + renderFindings() + renderDoors();
  window.scrollTo(0, y);
  const n = Object.keys(G.modules).length, sy = Object.values(G.symbols);
  document.getElementById("pkg").textContent = G.package;
  document.getElementById("counts").innerHTML = `<span>${n} modules · ${sy.filter(s => s.kind === "class" && !s.private).length} classes · ${sy.filter(s => s.kind === "function" && !s.private).length} functions</span><span class="pill ${G.findings.length ? "bad" : "ok"}">${G.findings.length} to fix</span>`;
}
document.addEventListener("click", e => {
  const t = e.target;
  const sto = t.closest("[data-story]"); if (sto){ e.preventDefault(); openStory(sto.dataset.story, true); return; }
  const station = t.closest("[data-station]"); if (station){ stopPlay(); STORY.at = Number(station.dataset.station); drawStory(); return; }
  const pl = t.closest("[data-play]"); if (pl){ e.preventDefault(); openFlow(pl.dataset.play.split(">"), true); return; }
  const sym = t.closest("[data-sym]"); if (sym){ e.preventDefault(); openSymbol(sym.dataset.sym); return; }
  const door = t.closest("[data-trace]"); if (door){ openTrace(door.dataset.trace); return; }
  if (t.closest("[data-more-doors]")){ state.doors = G.hops.length; render(); return; }
  if (t.closest("[data-whole]")){ stopPlay(); CODE.whole = !CODE.whole; showCode(CODE.id, CODE.calls); return; }
  const tab = t.closest("#dia-tabs .tab"); if (tab){ DIA.view = tab.dataset.view; DIA.open = new Set(); showView(); return; }
  const box = t.closest("g.box"); if (box){
    const k = box.dataset.key, ids = k.split(">"), id = ids[ids.length - 1];
    // Who uses it: mark where the box names the one it points at. What it calls: its body, its calls marked.
    const up = DIA.view === "up" && ids.length > 1 ? ids[ids.length - 2] : null;
    const at = up ? (S(id).callLines || {})[up] : null;
    showCode(id, at ? [{id: up, lines: at}] : []);
    if (!k.includes(">")) return;
    if (DIA.open.has(k)) [...DIA.open].forEach(x => { if (x === k || x.startsWith(k + ">")) DIA.open.delete(x); }); else DIA.open.add(k);
    drawDiagram(); return; }
  const step = t.closest("[data-step]"); if (step){ stopPlay(); TRACE.at = Number(step.dataset.step); TRACE.call = null; drawTrace(); return; }
});
document.getElementById("play-form").addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target, path = G ? flowFrom(document.getElementById("play-q").value) : null;
  form.classList.toggle("bad", !path);
  form.title = path ? "" : "A name that is not one function of ours, or no path of our calls between two of them";
  if (path) openFlow(path, true);
});
document.getElementById("dia-all").onclick = () => expandAll(300);
document.getElementById("dia-none").onclick = () => { DIA.open = new Set(); drawDiagram(); };
document.getElementById("dia-close").onclick = () => document.getElementById("dia").close();
document.getElementById("dia").addEventListener("close", () => { stopPlay(); setHash(); });
document.getElementById("dia-play").onclick = play;
// The speed takes hold at once, even halfway through a glide.
document.getElementById("dia-speed").onchange = e => { PLAY.speed = Number(e.target.value); try { localStorage.setItem("vc-speed", e.target.value); } catch {} };
try { const v = localStorage.getItem("vc-speed"); if (v && document.querySelector(`#dia-speed option[value="${v}"]`)){ document.getElementById("dia-speed").value = v; PLAY.speed = Number(v); } } catch {}
document.getElementById("codepane").addEventListener("wheel", () => { if (!PLAY.paused) stopPlay(); }, {passive: true});
document.getElementById("dia").addEventListener("click", e => { if (e.target.id === "dia") e.target.close(); });

/* ── live: the server reads the package again once its files settle; the page follows ── */
async function poll(){
  try {
    const v = await (await fetch("/version", {cache: "no-store"})).json();
    const live = document.getElementById("live"), err = document.getElementById("err");
    if (v.error){ live.classList.add("err"); document.getElementById("live-text").textContent = "a file does not parse"; err.hidden = false; document.getElementById("err-text").textContent = v.error; }
    else { live.classList.remove("err"); err.hidden = true; }
    if (v.version !== VERSION){
      VERSION = v.version;
      G = await (await fetch("/graph.json", {cache: "no-store"})).json();
      render();
      for (const k in SOURCES) delete SOURCES[k];
      if (FIRST){ FIRST = false; fromHash(); }
      else if (document.getElementById("dia").open && DIA.mode === "story"){ if (!PLAY.on){ const f = G.findings.find(x => x.id === STORY.f.id); if (f){ STORY.f = f; STORY.tale = STORIES[f.check](f); STORY.at = Math.min(STORY.at, STORY.tale.stations.length - 1); drawStory(); } } }
      else if (document.getElementById("dia").open && DIA.mode === "trace" && TRACE.flow){ if (!PLAY.on && TRACE.flow.every(id => S(id))){ setTrace(TRACE.flow.length === 1 ? traceFrom(TRACE.flow[0]) : traceAlong(TRACE.flow)); drawTrace(); } }
      else if (document.getElementById("dia").open && DIA.mode === "trace"){ const h = G.hops.find(x => x.entry === TRACE.entry); if (h){ stopPlay(); TRACE.call = null; setTrace(h.tree); drawTrace(); } }
      else if (document.getElementById("dia").open && DIA.mode === "symbol" && S(DIA.symbol)){ const view = DIA.view, open = DIA.open; openSymbol(DIA.symbol); DIA.view = view; DIA.open = open; showView(); }
      if (!v.error) document.getElementById("live-text").textContent = "live · read " + v.at;
    }
    // A cue from the CLI (`vibecheck play`): the first one seen on load is old news, every later one plays.
    if (CUE === null) CUE = v.cue;
    else if (v.cue !== CUE){ CUE = v.cue; if (G) openFlow(v.flow, true); }
  } catch { document.getElementById("live").classList.add("err"); document.getElementById("live-text").textContent = "server stopped"; }
  setTimeout(poll, 700);
}
poll();
</script>
