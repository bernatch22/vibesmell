# A tag vX.Y.Z publishes vibesmell X.Y.Z to PyPI, after the gates pass, by Trusted Publishing:
# no token anywhere. The tag must say the version the package declares.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag says the version the package declares
        if: github.ref_type == 'tag'
        run: |
          declared=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('vibesmell/__init__.py').read()).group(1))")
          test "v$declared" = "$GITHUB_REF_NAME"

  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [guard, gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [guard, gates, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
