# The gates: lint, vibesmell on itself, a TypeScript project read end to end, and the package built.
# Called on every push and pull request, and by release.yml before anything is published.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: lint
        run: uvx ruff check .
      - name: vibesmell finds nothing to fix in itself
        run: uv run --no-project --with . vibesmell check vibesmell
      - name: a TypeScript project is read end to end
        run: |
          mkdir -p /tmp/ts-fixture/src
          cd /tmp/ts-fixture
          printf '{"name":"fixture","main":"./src/index.ts"}' > package.json
          printf '{"compilerOptions":{"strict":true,"module":"NodeNext","moduleResolution":"NodeNext","target":"ES2022"},"include":["src"]}' > tsconfig.json
          printf 'import { twice } from "./math.js";\nexport function run(x: number): number { return twice(x); }\n' > src/index.ts
          printf 'export function twice(x: number): number { return x * 2; }\nexport function unused(): number { return 1; }\n' > src/math.ts
          set +e; uv run --no-project --with "$GITHUB_WORKSPACE" vibesmell check > out.txt 2>&1; code=$?; set -e
          cat out.txt
          test "$code" = 1
          grep -q '\[dead\].*unused' out.txt
      - name: build
        run: uv build
